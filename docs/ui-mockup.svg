<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" font-family="Microsoft YaHei UI, Noto Sans SC, Segoe UI, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1B2430"/>
      <stop offset="55%" stop-color="#10151D"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A212B"/>
      <stop offset="100%" stop-color="#141A22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FD1C5"/>
      <stop offset="100%" stop-color="#6C8CFF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="960" height="680" fill="url(#bg)"/>
  <circle cx="860" cy="40" r="160" fill="#4FD1C5" opacity="0.045"/>
  <circle cx="80" cy="640" r="200" fill="#6C8CFF" opacity="0.04"/>

  <!-- window -->
  <rect x="60" y="36" width="840" height="608" rx="26" fill="#0F141B" stroke="#FFFFFF" stroke-opacity="0.09" filter="url(#shadow)"/>
  <rect x="60" y="36" width="840" height="608" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>

  <!-- title bar -->
  <text x="96" y="86" fill="#E8EDF5" font-size="22" font-weight="700" letter-spacing="0.4">设备电量</text>
  <text x="96" y="112" fill="#8B95A7" font-size="12.5">4 台设备 · 2.4G 2 · 蓝牙 1 · 手柄 1</text>

  <!-- header buttons -->
  <circle cx="812" cy="86" r="17" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <path d="M806 82a8 8 0 1 1-1 8" fill="none" stroke="#AEB8C7" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M804 78v5h5" fill="none" stroke="#AEB8C7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="858" cy="86" r="17" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="858" cy="86" r="5.5" fill="none" stroke="#AEB8C7" stroke-width="1.7"/>
  <path d="M862 90l4 4" stroke="#AEB8C7" stroke-width="1.7" stroke-linecap="round"/>

  <!-- summary chips -->
  <g font-size="11.5">
    <rect x="96" y="128" width="92" height="26" rx="13" fill="#4FD1C5" fill-opacity="0.09" stroke="#4FD1C5" stroke-opacity="0.18"/>
    <circle cx="111" cy="141" r="3" fill="#4FD1C5"/>
    <text x="121" y="145" fill="#8FE7DF">全部在线</text>
    <rect x="198" y="128" width="72" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="212" y="145" fill="#8B95A7">低电量 1</text>
  </g>

  <!-- card 1 -->
  <g filter="url(#cardShadow)">
    <rect x="88" y="170" width="376" height="154" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>
  <rect x="88" y="170" width="4" height="154" rx="2" fill="url(#accent)" opacity="0.9"/>
  <g transform="translate(153 247)">
    <circle r="40" fill="#4FD1C5" opacity="0.06"/>
    <circle r="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="5"/>
    <circle r="34" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="132.4 213.6" transform="rotate(-90)" filter="url(#glow)"/>
    <text x="0" y="6" text-anchor="middle" fill="#E8EDF5" font-size="18" font-weight="700">62%</text>
  </g>
  <text x="214" y="207" fill="#E8EDF5" font-size="15" font-weight="600">雷蛇 炼狱蝰蛇 V3 Pro</text>
  <text x="214" y="228" fill="#8B95A7" font-size="11.5">2.4G · 刚刚 · 已验证</text>
  <rect x="214" y="243" width="86" height="24" rx="12" fill="#4ADE80" fill-opacity="0.09" stroke="#4ADE80" stroke-opacity="0.16"/>
  <circle cx="227" cy="255" r="3" fill="#4ADE80"/>
  <text x="236" y="259" fill="#86EFAC" font-size="11">放电中</text>
  <text x="214" y="291" fill="#5F6B7C" font-size="11">Razer 90-byte · 0x1F</text>
  <!-- mouse icon -->
  <g transform="translate(338 206)" stroke="#8B95A7" stroke-width="1.5" fill="none" opacity="0.9">
    <rect x="0" y="0" width="18" height="26" rx="9"/>
    <path d="M9 1v8"/>
    <path d="M0 9h18"/>
  </g>

  <!-- card 2 -->
  <g filter="url(#cardShadow)">
    <rect x="496" y="170" width="376" height="154" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>
  <rect x="496" y="170" width="4" height="154" rx="2" fill="url(#blue)" opacity="0.9"/>
  <g transform="translate(561 247)">
    <circle r="40" fill="#60A5FA" opacity="0.07"/>
    <circle r="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="5"/>
    <circle r="34" fill="none" stroke="url(#blue)" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="181.6 213.6" transform="rotate(-90)" filter="url(#glow)"/>
    <text x="0" y="6" text-anchor="middle" fill="#E8EDF5" font-size="18" font-weight="700">85%</text>
  </g>
  <text x="622" y="207" fill="#E8EDF5" font-size="15" font-weight="600">Steam Controller</text>
  <text x="622" y="228" fill="#8B95A7" font-size="11.5">2.4G Puck · 充电中</text>
  <rect x="622" y="243" width="86" height="24" rx="12" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.20"/>
  <path d="M630 255l4-5 4 5" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="642" y="259" fill="#BFDBFE" font-size="11">充电中</text>
  <text x="622" y="291" fill="#5F6B7C" font-size="11">Report 0x43 · 5s listen</text>
  <!-- gamepad icon -->
  <g transform="translate(754 206)" stroke="#8B95A7" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M5 6h10a5 5 0 0 1 4.9 6l-1 5a2 2 0 0 1-3.4 1l-2.2-2.2H8.7L6.5 18A2 2 0 0 1 3.1 17l-1-5A5 5 0 0 1 5 6z"/>
    <path d="M7 11v4M5 13h4"/>
    <circle cx="15" cy="11.5" r="0.8" fill="#8B95A7"/>
    <circle cx="17.5" cy="14" r="0.8" fill="#8B95A7"/>
  </g>

  <!-- card 3 -->
  <g filter="url(#cardShadow)">
    <rect x="88" y="340" width="376" height="154" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>
  <rect x="88" y="340" width="4" height="154" rx="2" fill="url(#amber)" opacity="0.9"/>
  <g transform="translate(153 417)">
    <circle r="40" fill="#F59E0B" opacity="0.06"/>
    <circle r="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="5"/>
    <circle r="34" fill="none" stroke="url(#amber)" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="85.4 213.6" transform="rotate(-90)" filter="url(#glow)"/>
    <text x="0" y="6" text-anchor="middle" fill="#E8EDF5" font-size="18" font-weight="700">40%</text>
  </g>
  <text x="214" y="377" fill="#E8EDF5" font-size="15" font-weight="600">Xbox Wireless Controller</text>
  <text x="214" y="398" fill="#8B95A7" font-size="11.5">蓝牙 · 1 分钟前 · 系统报告</text>
  <rect x="214" y="413" width="86" height="24" rx="12" fill="#F59E0B" fill-opacity="0.10" stroke="#F59E0B" stroke-opacity="0.18"/>
  <circle cx="227" cy="425" r="3" fill="#FBBF24"/>
  <text x="236" y="429" fill="#FCD34D" font-size="11">放电中</text>
  <text x="214" y="461" fill="#5F6B7C" font-size="11">RawGameController · mWh</text>
  <!-- controller icon -->
  <g transform="translate(338 376)" stroke="#8B95A7" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M5 6h10a5 5 0 0 1 4.9 6l-1 5a2 2 0 0 1-3.4 1l-2.2-2.2H8.7L6.5 18A2 2 0 0 1 3.1 17l-1-5A5 5 0 0 1 5 6z"/>
    <path d="M7 11v4M5 13h4"/>
    <circle cx="15" cy="11.5" r="0.8" fill="#8B95A7"/>
    <circle cx="17.5" cy="14" r="0.8" fill="#8B95A7"/>
  </g>

  <!-- card 4 -->
  <g filter="url(#cardShadow)">
    <rect x="496" y="340" width="376" height="154" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>
  <rect x="496" y="340" width="4" height="154" rx="2" fill="url(#red)" opacity="0.9"/>
  <g transform="translate(561 417)">
    <circle r="40" fill="#EF4444" opacity="0.06"/>
    <circle r="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="5"/>
    <circle r="34" fill="none" stroke="url(#red)" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="74.8 213.6" transform="rotate(-90)" filter="url(#glow)"/>
    <text x="0" y="6" text-anchor="middle" fill="#E8EDF5" font-size="18" font-weight="700">35%</text>
  </g>
  <text x="622" y="377" fill="#E8EDF5" font-size="15" font-weight="600">Sony WH-1000XM5</text>
  <text x="622" y="398" fill="#8B95A7" font-size="11.5">蓝牙 · 充电中 · 2 分钟前</text>
  <rect x="622" y="413" width="86" height="24" rx="12" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.20"/>
  <path d="M630 425l4-5 4 5" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="642" y="429" fill="#BFDBFE" font-size="11">充电中</text>
  <text x="622" y="461" fill="#5F6B7C" font-size="11">PnP property · HFP</text>
  <!-- headset icon -->
  <g transform="translate(754 376)" stroke="#8B95A7" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M4 16v-5a7 7 0 0 1 14 0v5"/>
    <rect x="1" y="15" width="5" height="8" rx="2"/>
    <rect x="16" y="15" width="5" height="8" rx="2"/>
  </g>

  <!-- footer -->
  <line x1="88" y1="526" x2="872" y2="526" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <text x="96" y="556" fill="#8B95A7" font-size="11.5">刷新间隔</text>
  <rect x="166" y="549" width="360" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="166" y="549" width="126" height="4" rx="2" fill="url(#accent)"/>
  <circle cx="292" cy="551" r="7" fill="#0F141B" stroke="#4FD1C5" stroke-width="2"/>
  <text x="166" y="576" fill="#5F6B7C" font-size="10">15 秒</text>
  <text x="494" y="576" fill="#5F6B7C" font-size="10">30 分钟</text>
  <rect x="548" y="538" width="64" height="28" rx="9" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="580" y="557" text-anchor="middle" fill="#E8EDF5" font-size="12" font-weight="600">60 秒</text>
  <text x="682" y="556" fill="#5F6B7C" font-size="11">上次刷新 12:31</text>
  <rect x="786" y="536" width="86" height="32" rx="10" fill="#4FD1C5" fill-opacity="0.08" stroke="#4FD1C5" stroke-opacity="0.18"/>
  <text x="829" y="557" text-anchor="middle" fill="#8FE7DF" font-size="11.5" font-weight="600">诊断</text>

  <!-- tray preview -->
  <g transform="translate(880 640)">
    <circle r="18" fill="#0F141B" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle r="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
    <circle r="11" fill="none" stroke="#4FD1C5" stroke-width="3" stroke-linecap="round" stroke-dasharray="43 69" transform="rotate(-90)"/>
  </g>
</svg>
