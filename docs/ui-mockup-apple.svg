<svg xmlns="http://www.w3.org/2000/svg" width="430" height="680" viewBox="0 0 430 680" font-family="Noto Sans CJK SC, Noto Sans SC, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#F7F7FA"/>
      <stop offset="100%" stop-color="#F2F2F7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E9BFF"/>
    </linearGradient>
    <filter id="windowShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0B1B33" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0B1B33" flood-opacity="0.07"/>
    </filter>
    <filter id="knobShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="430" height="680" fill="#E9E9EF"/>
  <rect x="14" y="12" width="402" height="656" rx="22" fill="url(#bg)" filter="url(#windowShadow)" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="14.5" y="12.5" width="401" height="655" rx="21.5" fill="none" stroke="#000" stroke-opacity="0.06"/>

  <!-- traffic lights -->
  <circle cx="40" cy="36" r="6" fill="#FF5F57"/>
  <circle cx="60" cy="36" r="6" fill="#FEBC2E"/>
  <circle cx="80" cy="36" r="6" fill="#28C840"/>

  <!-- header actions -->
  <circle cx="378" cy="36" r="15" fill="#000" fill-opacity="0.035"/>
  <path d="M373 32.5a6.4 6.4 0 1 1-1 6" fill="none" stroke="#6E6E73" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M371 29.5v4h4" fill="none" stroke="#6E6E73" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="36" r="15" fill="#000" fill-opacity="0.035"/>
  <path d="M395 32.5h10M395 36h10M395 39.5h10" stroke="#6E6E73" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="402" cy="32.5" r="1.7" fill="#FFFFFF" stroke="#6E6E73" stroke-width="1.1"/>
  <circle cx="398" cy="39.5" r="1.7" fill="#FFFFFF" stroke="#6E6E73" stroke-width="1.1"/>

  <!-- title -->
  <text x="34" y="86" fill="#1D1D1F" font-size="27" font-weight="700" letter-spacing="-0.4">电池</text>
  <text x="34" y="106" fill="#6E6E73" font-size="11.5">4 台设备 · 蓝牙 1 · 2.4G 2 · 手柄 1</text>

  <!-- low battery banner -->
  <rect x="30" y="122" width="370" height="34" rx="10" fill="#FF9F0A" fill-opacity="0.12"/>
  <circle cx="46" cy="139" r="3.6" fill="#FF9F0A"/>
  <text x="57" y="143" fill="#C26A00" font-size="11.2" font-weight="600">Xbox 手柄 电量低（18%），建议充电</text>

  <!-- segmented control -->
  <rect x="30" y="170" width="370" height="34" rx="9" fill="#767680" fill-opacity="0.10"/>
  <rect x="33" y="173" width="89" height="28" rx="7" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="77.5" y="191" text-anchor="middle" fill="#1D1D1F" font-size="12" font-weight="700">全部</text>
  <text x="172" y="191" text-anchor="middle" fill="#6E6E73" font-size="12">蓝牙</text>
  <text x="266" y="191" text-anchor="middle" fill="#6E6E73" font-size="12">2.4G</text>
  <text x="358" y="191" text-anchor="middle" fill="#6E6E73" font-size="12">手柄</text>

  <!-- card 1 -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="218" width="370" height="76" rx="18" fill="url(#card)"/>
  </g>
  <rect x="30.5" y="218.5" width="369" height="75" rx="17.5" fill="none" stroke="#000" stroke-opacity="0.05"/>
  <circle cx="64" cy="256" r="19" fill="#0A84FF" fill-opacity="0.10"/>
  <g stroke="#0A84FF" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <rect x="55.5" y="245" width="17" height="23" rx="8.5"/>
    <path d="M64 246v7M55.5 253h17" stroke-width="1.2"/>
  </g>
  <text x="94" y="250" fill="#1D1D1F" font-size="14.5" font-weight="600">雷蛇 炼狱蝰蛇 V3 Pro</text>
  <text x="94" y="270" fill="#6E6E73" font-size="11">2.4G · 刚刚 · 已验证</text>
  <text x="382" y="250" text-anchor="end" fill="#1D1D1F" font-size="19" font-weight="700">62%</text>
  <rect x="324" y="267" width="58" height="6" rx="3" fill="#767680" fill-opacity="0.16"/>
  <rect x="324" y="267" width="36" height="6" rx="3" fill="#0A84FF"/>

  <!-- card 2 -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="306" width="370" height="76" rx="18" fill="url(#card)"/>
  </g>
  <rect x="30.5" y="306.5" width="369" height="75" rx="17.5" fill="none" stroke="#000" stroke-opacity="0.05"/>
  <circle cx="64" cy="344" r="19" fill="#34C759" fill-opacity="0.12"/>
  <g stroke="#34C759" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <rect x="51" y="334" width="26" height="16" rx="6"/>
    <path d="M57 339v6M54 342h6"/>
    <circle cx="71" cy="339" r="1.1" fill="#34C759"/>
    <circle cx="74" cy="342" r="1.1" fill="#34C759"/>
  </g>
  <text x="94" y="338" fill="#1D1D1F" font-size="14.5" font-weight="600">Steam Controller</text>
  <text x="94" y="358" fill="#6E6E73" font-size="11">2.4G Puck · 充电中 · 已验证</text>
  <text x="382" y="338" text-anchor="end" fill="#1D1D1F" font-size="19" font-weight="700">85%</text>
  <rect x="324" y="355" width="58" height="6" rx="3" fill="#767680" fill-opacity="0.16"/>
  <rect x="324" y="355" width="49" height="6" rx="3" fill="#34C759"/>

  <!-- card 3 -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="394" width="370" height="76" rx="18" fill="url(#card)"/>
  </g>
  <rect x="30.5" y="394.5" width="369" height="75" rx="17.5" fill="none" stroke="#000" stroke-opacity="0.05"/>
  <circle cx="64" cy="432" r="19" fill="#FF9F0A" fill-opacity="0.12"/>
  <g stroke="#FF9F0A" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <rect x="51" y="423" width="26" height="17" rx="7"/>
    <path d="M57 428v6M54 431h6"/>
    <circle cx="71" cy="428" r="1.1" fill="#FF9F0A"/>
    <circle cx="74" cy="431" r="1.1" fill="#FF9F0A"/>
  </g>
  <text x="94" y="426" fill="#1D1D1F" font-size="14.5" font-weight="600">Xbox Wireless Controller</text>
  <text x="94" y="446" fill="#6E6E73" font-size="11">蓝牙 · 1 分钟前 · 系统报告</text>
  <text x="382" y="426" text-anchor="end" fill="#1D1D1F" font-size="19" font-weight="700">18%</text>
  <rect x="324" y="443" width="58" height="6" rx="3" fill="#767680" fill-opacity="0.16"/>
  <rect x="324" y="443" width="10" height="6" rx="3" fill="#FF9F0A"/>

  <!-- card 4 -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="482" width="370" height="76" rx="18" fill="url(#card)"/>
  </g>
  <rect x="30.5" y="482.5" width="369" height="75" rx="17.5" fill="none" stroke="#000" stroke-opacity="0.05"/>
  <circle cx="64" cy="520" r="19" fill="#FF375F" fill-opacity="0.10"/>
  <g stroke="#FF375F" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <path d="M53 517v-2a11 11 0 0 1 22 0v2"/>
    <rect x="51" y="516" width="6" height="10" rx="3"/>
    <rect x="71" y="516" width="6" height="10" rx="3"/>
  </g>
  <text x="94" y="514" fill="#1D1D1F" font-size="14.5" font-weight="600">Sony WH-1000XM5</text>
  <text x="94" y="534" fill="#6E6E73" font-size="11">蓝牙 · 充电中 · 系统报告</text>
  <text x="382" y="514" text-anchor="end" fill="#1D1D1F" font-size="19" font-weight="700">35%</text>
  <rect x="324" y="531" width="58" height="6" rx="3" fill="#767680" fill-opacity="0.16"/>
  <rect x="324" y="531" width="20" height="6" rx="3" fill="#34C759"/>

  <!-- footer -->
  <line x1="30" y1="590" x2="400" y2="590" stroke="#000" stroke-opacity="0.06"/>
  <text x="32" y="617" fill="#8E8E93" font-size="10.5">每 60 秒 · 刚刚刷新</text>
  <rect x="330" y="601" width="70" height="28" rx="8" fill="#767680" fill-opacity="0.10"/>
  <text x="365" y="619" text-anchor="middle" fill="#6E6E73" font-size="11.5">诊断</text>

  <!-- tray preview -->
  <g transform="translate(386 654)">
    <circle r="13" fill="#FFFFFF" stroke="#000" stroke-opacity="0.08"/>
    <circle r="8" fill="none" stroke="#767680" stroke-opacity="0.18" stroke-width="2.6"/>
    <circle r="8" fill="none" stroke="#0A84FF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="32 51" transform="rotate(-90)"/>
  </g>
</svg>
