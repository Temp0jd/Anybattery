[workspace]
members = [
    "crates/anybattery-core",
    "crates/anybattery-windows",
    "crates/anybattery-app",
]
resolver = "2"
default-members = ["crates/anybattery-core"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["AnyBattery contributors"]

[workspace.dependencies]
anybattery-core = { path = "crates/anybattery-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

